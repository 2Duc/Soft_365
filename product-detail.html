<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết sản phẩm - Soft365</title>
    <link rel="stylesheet" href="./bootstrap/css/bootstrap.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="./style.css">
    <style>
        .pd-header{
            background-color: rgb(237, 130, 49);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .pd-header img{
            height: 36px;
        }
        .pd-header a.back-link{
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
        .pd-wrapper{
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 16px;
        }
        .pd-breadcrumb{
            font-size: 13px;
            color: #888;
            margin-bottom: 16px;
        }
        .pd-card{
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            background: #fff;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            padding: 24px;
        }
        .pd-image{
            flex: 1 1 320px;
            max-width: 380px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fafafa;
            border-radius: 10px;
            padding: 20px;
        }
        .pd-image img{
            max-width: 100%;
            max-height: 320px;
            object-fit: contain;
        }
        .pd-info{
            flex: 1 1 320px;
        }
        .pd-info h1{
            font-size: 22px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 16px;
        }
        .pd-info ul{
            list-style: none;
            padding: 0;
            margin: 0 0 24px 0;
        }
        .pd-info ul li{
            padding: 8px 0;
            border-bottom: 1px dashed #eee;
            font-size: 14px;
            color: #555;
        }
        .pd-quote-btn{
            background-color: rgb(237, 130, 49);
            color: #fff;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
        }
        .pd-quote-btn:hover{
            background-color: rgb(210, 110, 35);
            color: #fff;
        }
        .pd-empty{
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="pd-header">
        <a class="back-link" href="./index.html">&larr; Trang chủ</a>
        <img src="./assets/soft365.png" alt="Soft365">
    </div>

    <div class="pd-wrapper">
        <div class="pd-breadcrumb"><a href="./index.html" style="color:#888;text-decoration:none;">Trang chủ</a> / Chi tiết sản phẩm</div>
        <div class="pd-card" id="pdCard">
            <!-- Nội dung sẽ được điền bằng JS dựa trên query string -->
        </div>
    </div>

    <!-- Modal Nhận báo giá (dùng lại cho trang chi tiết) -->
    <div class="modal fade" id="quoteModal" tabindex="-1" aria-labelledby="quoteModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content quote-modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="quoteModalLabel">Vui lòng nhập thông tin để nhận báo giá!</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
                </div>
                <div class="modal-body">
                    <form id="quoteForm">
                        <div class="mb-3">
                            <label class="form-label">Họ &amp; Tên <span class="required-star">*</span></label>
                            <input type="text" class="form-control" name="fullname" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Địa chỉ Email <span class="required-star">*</span></label>
                            <input type="email" class="form-control" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Số điện thoại <span class="required-star">*</span></label>
                            <input type="tel" class="form-control" name="phone" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Thông tin yêu cầu <span class="required-star">*</span></label>
                            <textarea class="form-control" name="message" rows="3" required></textarea>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="agreeTerms" required>
                            <label class="form-check-label" for="agreeTerms">Tôi đồng ý với các điều khoản trên</label>
                        </div>
                        <button type="submit" class="btn quote-submit-btn w-100">Gửi đi</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function(){
            var params = new URLSearchParams(window.location.search);
            var name = params.get('name');
            var img = params.get('img');
            var card = document.getElementById('pdCard');

            if(!name){
                card.innerHTML = '<div class="pd-empty">Không tìm thấy thông tin sản phẩm. <a href="./index.html">Quay lại trang chủ</a></div>';
            } else {
                var safeName = name.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                var safeImg = img ? img.replace(/"/g, '&quot;') : './assets/soft365.png';
                card.innerHTML =
                    '<div class="pd-image"><img src="' + safeImg + '" alt="' + safeName + '"></div>' +
                    '<div class="pd-info">' +
                        '<h1>' + safeName + '</h1>' +
                        '<ul>' +
                            '<li>Sản phẩm chính hãng, đầy đủ giấy tờ, hóa đơn VAT</li>' +
                            '<li>Bảo hành theo tiêu chuẩn nhà sản xuất</li>' +
                            '<li>Hỗ trợ tư vấn cấu hình, lắp đặt và triển khai miễn phí</li>' +
                            '<li>Giao hàng toàn quốc, thanh toán linh hoạt</li>' +
                        '</ul>' +
                        '<button type="button" class="pd-quote-btn" id="pdQuoteBtn">Nhận Báo Giá</button>' +
                    '</div>';
                document.title = safeName + ' - Soft365';
            }

            var quoteModalEl = document.getElementById('quoteModal');
            var quoteModal = new bootstrap.Modal(quoteModalEl);
            document.addEventListener('click', function(e){
                if(e.target && e.target.id === 'pdQuoteBtn'){
                    quoteModal.show();
                }
            });
            var quoteForm = document.getElementById('quoteForm');
            quoteForm.addEventListener('submit', function(e){
                e.preventDefault();
                quoteModal.hide();
                quoteForm.reset();
                alert('Cảm ơn bạn! Chúng tôi đã nhận được yêu cầu và sẽ liên hệ báo giá sớm nhất.');
            });
        })();
    </script>
</body>
</html>
